name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The oldest Go that go.mod allows, and the newest.
        go: ['1.25', 'stable']
    name: test (Go ${{ matrix.go }})
    env:
      GOTOOLCHAIN: local # test the Go asked for, not a newer one it fetches
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go version

      # The differential tests run the same cases through Perl (5.36 or
      # later) and compare. These two modules aren't in Perl's core; without
      # them, their tests skip.
      - name: Perl modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-pp-perl liblist-utilsby-perl
          perl -v | head -2
          perl -MYAML::PP -MList::UtilsBy -e 'print "modules ok\n"'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - run: go vet ./...

      - run: go test -race ./...

      # Known vulnerabilities in what scalar calls, in its dependencies or
      # the standard library. govulncheck itself needs a recent Go.
      - name: govulncheck
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # Fail if a Perl differential test skipped, so a missing module can't
      # quietly turn the comparison off.
      - name: no Perl tests skipped
        run: |
          if go test -v -run 'Perl' . | grep -- '--- SKIP'; then exit 1; fi
