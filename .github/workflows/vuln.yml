name: vulnerabilities

# A vulnerability published after a release would otherwise go unnoticed
# until the next push, so govulncheck also runs every week, on main, the
# latest release. GitHub notifies the maintainer of a failed run. Run
# it by hand with `gh workflow run vuln.yml`.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The newest Go, so that the standard library's own fixes count:
      # a user on an older Go is told by govulncheck in their own build.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go version
      # Known vulnerabilities in what scalar calls, in its dependencies or
      # the standard library.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
